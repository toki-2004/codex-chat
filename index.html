<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Codex Chat</title>
<style>
:root {
  --bg: #f2f3f7;
  --card: #ffffff;
  --line: #e5e7ee;
  --text: #23262f;
  --muted: #8a8f98;
  --accent: #4c6ef5;
  --accent-soft: #eef1fe;
  --agent: #10a37f;
  --agent-soft: #e7f7f2;
  --danger: #e5484d;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(25, 32, 60, .06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.hidden { display: none !important; }
.view { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }

/* ---------- 登录页 ---------- */
.auth-view { align-items: center; justify-content: center; padding: 24px; }
.auth-card {
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
  width: min(400px, 100%); padding: 30px 26px; text-align: center;
}
.auth-logo {
  width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 14px;
  background: linear-gradient(135deg, #4c6ef5, #10a37f); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 26px;
}
.auth-card h1 { margin: 0 0 4px; font-size: 21px; }
.auth-sub { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
.auth-card input {
  width: 100%; border: 1px solid var(--line); border-radius: 11px;
  padding: 12px 14px; font-size: 15px; margin-bottom: 12px; outline: none; background: var(--bg);
}
.auth-card input:focus { border-color: var(--accent); background: #fff; }
.auth-btn { width: 100%; padding: 12px; font-size: 15px; border-radius: 11px; }
.auth-err { margin-top: 12px; font-size: 13px; color: var(--danger); }
.auth-hint { margin-top: 14px; font-size: 12px; color: var(--muted); }

/* ---------- 顶部栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
.logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #4c6ef5, #10a37f);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex: none;
}
.sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 8px 13px; font-size: 13px; cursor: pointer; flex: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn:active { filter: brightness(.94); }
.icon-btn {
  border: none; background: none; font-size: 18px; cursor: pointer;
  width: 36px; height: 36px; border-radius: 10px; color: var(--text);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: var(--bg); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #c0c4cf; display: inline-block; }
.conn-dot.on { background: #12b886; }
.conn-dot.off { background: var(--danger); }

/* ---------- 消息区 ---------- */
.chat-main { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg-row { display: flex; flex-direction: column; max-width: 88%; }
.msg-row.me { align-self: flex-end; align-items: flex-end; }
.msg-row.other { align-self: flex-start; align-items: flex-start; }
.msg-row.system { align-self: center; max-width: 96%; }
.msg-meta { font-size: 11px; color: var(--muted); margin: 0 4px 3px; display: flex; gap: 6px; align-items: center; }
.msg-meta .m-name { font-weight: 600; }
.bubble {
  background: var(--card); border-radius: 14px; padding: 8px 12px;
  box-shadow: var(--shadow); font-size: 14px; line-height: 1.55;
  word-break: break-word;
}
.msg-row.me .bubble { background: var(--accent-soft); }
.msg-row.agent .bubble { background: var(--agent-soft); }
.msg-row.system .bubble { background: transparent; box-shadow: none; color: var(--muted); font-size: 12px; padding: 2px 8px; text-align: center; }
.bubble p { margin: 0 0 6px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble code {
  background: rgba(35, 38, 47, .08); border-radius: 4px; padding: 1px 5px;
  font-family: Consolas, Menlo, monospace; font-size: 13px;
}
.bubble pre.code {
  background: #1e2430; color: #e8ecf5; border-radius: 10px; padding: 10px 12px;
  overflow-x: auto; margin: 6px 0;
}
.bubble pre.code code { background: none; padding: 0; color: inherit; font-size: 12.5px; }
.bubble a { color: var(--accent); }

/* ---------- 执行过程 ---------- */
.proc-area { display: flex; flex-direction: column; gap: 6px; }
.proc-text { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.proc-cmd {
  background: #1e2430; color: #e8ecf5; border-radius: 10px;
  font-family: Consolas, Menlo, monospace; font-size: 12px;
}
.proc-cmd summary {
  cursor: pointer; padding: 8px 10px; list-style: none; display: flex; gap: 6px; align-items: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.proc-cmd summary::-webkit-details-marker { display: none; }
.proc-cmd .pc-arrow { color: var(--agent); flex: none; }
.proc-cmd .pc-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.proc-cmd .pc-state { color: var(--muted); font-size: 11px; flex: none; }
.proc-cmd[open] summary { border-bottom: 1px solid rgba(255,255,255,.12); }
.proc-out { margin: 0; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
.proc-exit { padding: 0 10px 8px; font-size: 11px; color: var(--muted); }
.proc-cmd.running .pc-arrow { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.typing-row { align-self: flex-start; display: flex; gap: 8px; align-items: center; }
.typing-bubble {
  background: var(--agent-soft); border-radius: 14px; padding: 10px 14px;
  display: flex; gap: 4px; align-items: center;
}
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--agent); animation: blink 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

/* ---------- 输入栏 ---------- */
.input-bar {
  flex: none; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line);
}
.input-bar textarea {
  flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font-size: 15px; font-family: inherit; max-height: 120px;
  outline: none; background: var(--bg); color: var(--text);
}
.input-bar textarea:focus { border-color: var(--accent); background: #fff; }
.send-btn {
  width: 44px; height: 44px; border-radius: 12px; border: none; flex: none;
  background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
}
.send-btn:disabled { opacity: .45; }
.footbar {
  flex: none; padding: 6px 14px calc(6px + env(safe-area-inset-bottom));
  font-size: 11px; color: var(--muted); text-align: center; border-top: 1px solid var(--line);
  background: var(--card);
}
.footbar .mono { font-family: Consolas, Menlo, monospace; }

/* ---------- 侧边面板（菜单/成员/用户管理） ---------- */
.panel-mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 35; }
.side-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 86vw);
  background: var(--card); box-shadow: -6px 0 24px rgba(0,0,0,.12); z-index: 40;
  display: flex; flex-direction: column; transform: translateX(105%); transition: transform .22s ease;
}
.side-panel.open { transform: translateX(0); }
.side-panel .sp-head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.side-panel .sp-head span { flex: 1; }
.sp-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.member-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; }
.member-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.menu-item {
  display: flex; align-items: center; gap: 10px; padding: 13px 16px;
  font-size: 14px; border: none; background: none; width: 100%; cursor: pointer; color: var(--text);
}
.menu-item:active { background: var(--bg); }
.menu-item.danger { color: var(--danger); }
.menu-account { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.menu-account .ma-name { font-weight: 700; }
.menu-account .ma-user { font-size: 12px; color: var(--muted); }

/* ---------- 用户管理 ---------- */
.user-add { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.user-add input {
  width: 100%; border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; font-size: 13px; margin-bottom: 8px; outline: none; background: var(--bg);
}
.user-add input:focus { border-color: var(--accent); background: #fff; }
.user-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; }
.user-item .u-info { flex: 1; min-width: 0; }
.user-item .u-name { font-weight: 600; font-size: 14px; }
.user-item .u-username { font-size: 12px; color: var(--muted); }
.user-item .u-actions { display: flex; gap: 6px; flex: none; }
.user-item .u-actions button { font-size: 12px; padding: 5px 9px; }
.role-tag { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
.role-tag.admin { background: #fef3e2; color: #b7791f; }
.empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 16px; }

/* ---------- 对话列表 ---------- */
.conv-new { margin: 10px 14px; width: calc(100% - 28px); }
.conv-item {
  display: flex; align-items: center; gap: 8px; padding: 11px 14px;
  border: none; background: none; width: 100%; cursor: pointer; color: var(--text); text-align: left;
}
.conv-item:active { background: var(--bg); }
.conv-item.active { background: var(--accent-soft); }
.conv-item .c-info { flex: 1; min-width: 0; }
.conv-item .c-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-item .c-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.conv-item .c-del {
  border: none; background: none; color: var(--muted); font-size: 14px;
  cursor: pointer; padding: 4px 7px; border-radius: 8px; flex: none;
}
.conv-item .c-del:active { background: var(--bg); color: var(--danger); }
.stream-caret {
  display: inline-block; width: 2px; height: 1em; background: var(--agent);
  vertical-align: -2px; margin-left: 2px; animation: caretBlink .8s infinite;
}
@keyframes caretBlink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(20, 24, 38, .45); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--card); border-radius: 16px; width: min(420px, 100%);
  padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.2);
}
.modal h3 { margin: 0 0 14px; font-size: 17px; }
.modal label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.modal input {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; outline: none; background: var(--bg);
}
.modal input:focus { border-color: var(--accent); background: #fff; }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(10px);
  background: #242936; color: #fff; font-size: 13px; padding: 10px 18px;
  border-radius: 12px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60;
  max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<!-- 登录 / 初始化 -->
<div class="view auth-view hidden" id="authView">
  <div class="auth-card">
    <div class="auth-logo">◈</div>
    <h1>Codex Chat</h1>
    <p class="auth-sub" id="authSub">登录后与本机 Codex 对话</p>
    <input id="authUser" placeholder="账号" autocomplete="username">
    <input id="authPass" type="password" placeholder="密码" autocomplete="current-password">
    <input id="authName" class="hidden" placeholder="显示名称（可选）" maxlength="24" autocomplete="off">
    <button class="btn primary auth-btn" id="authSubmit">登 录</button>
    <div class="auth-err hidden" id="authErr"></div>
    <div class="auth-hint hidden" id="authHint"></div>
  </div>
</div>

<!-- 聊天 -->
<div class="view hidden" id="chatView">
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div style="min-width:0">
        <div>Codex</div>
        <div class="sub" id="connText"><span class="conn-dot" id="connDot"></span> 连接中…</div>
      </div>
    </div>
    <button class="btn" id="memberBtn">成员 <span id="onlineNum">0</span></button>
    <button class="icon-btn" id="menuBtn" title="菜单">☰</button>
  </header>

  <main class="chat-main" id="chatMain">
    <div class="msg-list" id="msgList"></div>
    <div class="proc-area" id="processArea"></div>
    <div class="typing-row hidden" id="typingRow">
      <div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
    </div>
  </main>

  <footer class="input-bar">
    <textarea id="chatInput" rows="1" placeholder="给本机 Codex 发消息，Enter 发送" autocomplete="off"></textarea>
    <button class="send-btn" id="sendBtn" title="发送">➤</button>
  </footer>
  <div class="footbar" id="footbar">加载中…</div>
</div>

<!-- 遮罩与侧边面板 -->
<div class="panel-mask hidden" id="panelMask"></div>
<div class="side-panel" id="menuPanel">
  <div class="sp-head"><span>菜单</span><button class="icon-btn" id="menuCloseBtn">✕</button></div>
  <div class="menu-account">
    <div class="ma-name" id="menuName"></div>
    <div class="ma-user" id="menuUsername"></div>
  </div>
  <div class="sp-body">
    <button class="menu-item" id="menuUsersBtn">👥 用户管理</button>
    <button class="menu-item" id="menuConvBtn">💬 对话列表</button>
    <button class="menu-item" id="menuPwBtn">🔑 修改密码</button>
    <button class="menu-item danger" id="menuLogoutBtn">⏻ 退出登录</button>
  </div>
</div>
<div class="side-panel" id="convPanel">
  <div class="sp-head"><span>对话</span><button class="icon-btn" id="convCloseBtn">✕</button></div>
  <div class="sp-body">
    <button class="btn primary conv-new" id="newConvBtn">＋ 新建对话</button>
    <div id="convList"></div>
  </div>
</div>
<div class="side-panel" id="memberPanel">
  <div class="sp-head"><span>在线设备</span><button class="icon-btn" id="panelCloseBtn">✕</button></div>
  <div class="sp-body" id="memberList"></div>
</div>
<div class="side-panel" id="usersPanel">
  <div class="sp-head"><span>用户管理</span><button class="icon-btn" id="usersCloseBtn">✕</button></div>
  <div class="user-add">
    <input id="nuName" placeholder="账号（2-24 位中文/字母/数字/下划线）" maxlength="24" autocomplete="off">
    <input id="nuPass" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password">
    <input id="nuDisplay" placeholder="显示名称（可选）" maxlength="24" autocomplete="off">
    <button class="btn primary" id="nuAddBtn" style="width:100%">添加用户</button>
  </div>
  <div class="sp-body" id="userList"></div>
</div>

<!-- 弹窗容器 -->
<div class="modal-mask hidden" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

/* ================= 工具 ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(ts) {
  const d = new Date(ts);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const now = new Date();
  return (d.toDateString() === now.toDateString()) ? hm : (pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm);
}

async function fetchJSON(url, opts, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 8000);
  try {
    const res = await fetch(url, Object.assign({ signal: ctrl.signal }, opts));
    if (res.status === 401) throw new Error('unauthorized');
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) { /* 忽略 */ }
      throw new Error(msg);
    }
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ================= 全局状态 ================= */
let account = null;      // 登录账号 {userId, username, displayName, role}
let messages = [];
let conversations = [];  // 对话列表 [{id,title,createdAt,updatedAt,messageCount,active}]
let activeConvId = null; // 服务端当前活跃对话
let displayedConvId = null; // 本端正在展示的对话
let codexBusy = false;
let serverCfg = { cwd: '', model: 'default', sandbox: '', maxMessageLen: 500 };
let streamTimer = null;  // 流式打字机定时器
let streamMsgId = null;  // 正在流式显示的 agent 消息 id
let processBlocks = [];  // 当前回合实时执行过程块
let processCmdIdx = null; // 正在运行的命令块索引

const socket = io({ autoConnect: false, transports: ['websocket', 'polling'] });

/* ================= Markdown（安全渲染） ================= */
function renderMarkdown(text) {
  const blocks = [];
  let html = esc(text).replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push('<pre class="code"><code>' + code + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  html = html
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, '<br>');
  return html.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[Number(i)]);
}

function renderProcessHistory(proc) {
  if (!Array.isArray(proc) || !proc.length) return '';
  return '<div class="proc-area">' + proc.map((p) => {
    if (p && p.type === 'cmd') {
      return '<details class="proc-cmd"><summary><span class="pc-arrow">▸</span><span class="pc-line">$ ' + esc(p.command || '') + '</span></summary>'
        + '<pre class="proc-out">' + esc(p.output || '') + '</pre>'
        + '<div class="proc-exit">exit code: ' + esc(p.exitCode == null ? '-' : p.exitCode) + '</div></details>';
    }
    if (p && p.type === 'text' && p.text) {
      return '<div class="proc-text">' + renderMarkdown(p.text) + '</div>';
    }
    return '';
  }).join('') + '</div>';
}

/* ================= 消息渲染 ================= */
const MAX_CLIENT_MSGS = 300;

function msgBubble(m) {
  if (m.role === 'system') {
    return '<div class="msg-row system"><div class="bubble">' + esc(m.text) + '</div></div>';
  }
  const isAgent = m.role === 'agent' || m.userId === 'codex';
  const isMe = account && m.userId === account.userId;
  const cls = isAgent ? 'agent' : (isMe ? 'me' : 'other');
  const name = isAgent ? 'Codex' : m.name;
  const color = isAgent ? '#10a37f' : (m.color || '#888888');
  const body = isAgent ? '<div class="bubble">' + renderProcessHistory(m.process) + renderMarkdown(m.text) + '</div>'
    : '<div class="bubble">' + esc(m.text) + '</div>';
  return '<div class="msg-row ' + cls + '" data-mid="' + esc(m.id) + '">'
    + '<div class="msg-meta"><span class="m-name" style="color:' + esc(color) + '">' + esc(name) + '</span>'
    + (isMe ? '<span>(我)</span>' : '') + '<span>' + fmtTime(m.at) + '</span></div>'
    + body + '</div>';
}

function renderChat() {
  $('msgList').innerHTML = messages.map(msgBubble).join('');
  scrollToBottom(false);
}

function scrollToBottom(force) {
  const el = $('chatMain');
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  if (force || nearBottom) el.scrollTop = el.scrollHeight;
}

function mergeMessages(incoming) {
  if (!Array.isArray(incoming) || !incoming.length) return;
  const have = new Set(messages.map((m) => m.id));
  for (const m of incoming) if (m && m.id && !have.has(m.id)) messages.push(m);
  messages.sort((a, b) => a.at - b.at);
  if (messages.length > MAX_CLIENT_MSGS) messages = messages.slice(-MAX_CLIENT_MSGS);
}

/* ================= 实时执行过程 ================= */
function clearProcess() {
  processBlocks = [];
  processCmdIdx = null;
  $('processArea').innerHTML = '';
}

function renderProcessBlocks() {
  $('processArea').innerHTML = processBlocks.map((b) => {
    if (b.kind === 'cmd') {
      const running = b.running ? ' running' : '';
      const state = b.running ? '运行中' : (b.exitCode == null ? '' : 'exit ' + b.exitCode);
      return '<details class="proc-cmd' + running + '"' + (b.open ? ' open' : '') + '><summary>'
        + '<span class="pc-arrow">' + (b.running ? '◌' : '▸') + '</span>'
        + '<span class="pc-line">$ ' + esc(b.command || '') + '</span>'
        + (state ? '<span class="pc-state">' + esc(state) + '</span>' : '')
        + '</summary>' + (b.output != null ? '<pre class="proc-out">' + esc(b.output) + '</pre>' : '')
        + (b.exitCode != null ? '<div class="proc-exit">exit code: ' + esc(b.exitCode) + '</div>' : '')
        + '</details>';
    }
    if (b.kind === 'text' && b.text) {
      return '<div class="proc-text">' + renderMarkdown(b.text) + '</div>';
    }
    return '';
  }).join('');
  scrollToBottom(false);
}

function addProcessBlock(b) {
  processBlocks.push(b);
  if (b.kind === 'cmd' && b.running) processCmdIdx = processBlocks.length - 1;
  renderProcessBlocks();
}

async function newConversation() {

async function switchConversation(id) {

  try {

    + '<div class="modal-btns"><button class="btn" id="delConvCancel">取消</button>'
    + '<button class="btn danger primary" id="delConvOk">删除</button></div>',
    (box) => {

/* ================= 流式打字机 ================= */
function stopStream() {
  if (streamTimer) { clearTimeout(streamTimer); streamTimer = null; }
  if (streamMsgId) {
    const m = messages.find((x) => x.id === streamMsgId);
    streamMsgId = null;
    if (m) {
      const row = $('msgList').querySelector('[data-mid="' + m.id + '"]');
      if (row) {
        const b = row.querySelector('.bubble');
        if (b) b.innerHTML = renderMarkdown(m.text || '');
      }
    }
  }
}

function streamMessage(m) {
  stopStream();
  streamMsgId = m.id;
  const full = String(m.text || '');
  let i = 0;
  const step = 2;
  const interval = 24;
  const tick = () => {
    const target = messages.find((x) => x.id === m.id);
    if (!target || streamMsgId !== m.id) return;
    i = Math.min(i + step, full.length);
    const row = $('msgList').querySelector('[data-mid="' + m.id + '"]');
    if (row) {
      const b = row.querySelector('.bubble');
      if (b) b.innerHTML = esc(full.slice(0, i)).replace(/\n/g, '<br>') + '<span class="stream-caret"></span>';
      scrollToBottom(false);
    }
    if (i >= full.length) {
      streamMsgId = null;
      streamTimer = null;
      if (row) {
        const b = row.querySelector('.bubble');
        if (b) b.innerHTML = renderMarkdown(full);
      }
      scrollToBottom(false);
      return;
    }
    streamTimer = setTimeout(tick, interval);
  };
  tick();
}

/* ================= 发送消息 ================= */
function sendChat() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || !account) return;
  if (text.length > serverCfg.maxMessageLen) return toast('消息过长（最多 ' + serverCfg.maxMessageLen + ' 字）');
  input.value = '';
  autosize();
  scrollToBottom(true); // 发送后立即滚到底部，露出加载/过程动画
  socket.emit('chat-message', { text }, (res) => {
    if (!res || !res.ok) {
      toast((res && res.reason) || '发送失败');
      input.value = text;
      autosize();
    }
  });
}

function autosize() {
  const el = $('chatInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

/* ================= Socket 事件 ================= */
socket.on('connect', async () => {
  if (!account) return;
  setConn('on');
  socket.emit('set-user', { color: colorOf(account.userId) });
  try {
    const data = await fetchJSON('/api/messages', {}, 8000);
    mergeMessages(data.messages);
    renderChat();
    if (data.messages && data.messages.length) scrollToBottom(true);
  } catch (e) { /* 忽略 */ }
  loadConversations();
});
socket.on('disconnect', () => setConn('off'));
socket.on('connect_error', (err) => {
  setConn('off');
  if (err && err.message === 'unauthorized') {
    toast('登录状态已失效，请重新登录');
    account = null;
    messages = [];
    renderChat();
    showAuth('login');
  }
});

socket.on('welcome', (p) => {
  if (p && p.config) {
    serverCfg = Object.assign(serverCfg, p.config);
    $('chatInput').maxLength = p.config.maxMessageLen || 500;
    updateFootbar();
  }
});

socket.on('chat-message', (m) => {
  if (!m || m.text == null) return;
  if (m.conversationId && m.conversationId !== displayedConvId) return;
  mergeMessages([m]);
  renderChat();
  if (m.stream) {
    clearProcess(); // 回合结束，实时过程并入最终消息的历史回放
    $('typingRow').classList.add('hidden');
    streamMessage(m);
  } else {
    stopStream();
  }
});

socket.on('chat-process', (p) => {
  if (!p) return;
  if (p.conversationId && p.conversationId !== displayedConvId) return;
  if (p.type === 'cmd') {
    if (p.status === 'start') {
      addProcessBlock({ kind: 'cmd', command: p.command || '', running: true, open: true });
    } else if (processCmdIdx != null && processBlocks[processCmdIdx]
        && processBlocks[processCmdIdx].kind === 'cmd' && processBlocks[processCmdIdx].running) {
      const b = processBlocks[processCmdIdx];
      b.running = false;
      b.output = p.output || '';
      b.exitCode = p.exitCode;
      b.open = true;
      processCmdIdx = null;
      renderProcessBlocks();
    } else {
      addProcessBlock({ kind: 'cmd', command: p.command || '', running: false, output: p.output || '', exitCode: p.exitCode, open: true });
    }
  } else if (p.type === 'text' && p.text) {
    addProcessBlock({ kind: 'text', text: p.text });
  }
});

socket.on('conversations', (p) => {
  if (!p) return;
  conversations = Array.isArray(p.conversations) ? p.conversations : [];
  activeConvId = p.activeId || null;
  renderConvList();
  if (activeConvId !== displayedConvId) {
    displayedConvId = activeConvId;
    loadActiveMessages();
  }
});

socket.on('codex-status', (p) => {
  codexBusy = !!(p && p.busy);
  $('typingRow').classList.toggle('hidden', !codexBusy);
  scrollToBottom(true);
});

socket.on('members', (list) => {
  const members = Array.isArray(list) ? list : [];
  $('onlineNum').textContent = members.length;
  $('memberList').innerHTML = members.map((m) =>
    '<div class="member-item"><span class="member-dot" style="background:' + esc(m.color || '#888') + '"></span>'
    + esc(m.name || '匿名') + (account && m.userId === account.userId ? '（我）' : '') + '</div>'
  ).join('') || '<div class="member-item" style="color:var(--muted)">暂无其他设备</div>';
});

  $('connText').textContent = (state === 'on' ? '已连接本机 Codex' : (state === 'off' ? '连接已断开' : '连接中…'));

/* ================= 身份颜色 ================= */
const USER_COLORS = ['#4c6ef5', '#12b886', '#fa5252', '#f59f00', '#7048e8', '#0ca678', '#e8590c', '#3b5bdb', '#c2255c', '#1098ad'];
function colorOf(userId) {
  let h = 0;
  for (const ch of String(userId)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return USER_COLORS[h % USER_COLORS.length];
}

  $('menuPwBtn').onclick = () => { togglePanel(null, false); changeOwnPassword(); };
  $('menuLogoutBtn').onclick = logout;
  $('nuAddBtn').onclick = addUser;

  $('modalMask').addEventListener('click', (e) => {
    if (e.target === $('modalMask')) closeModal(null);
  });

  const input = $('chatInput');
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendChat();
    }
  });

  let me = null;
  try {
    me = await fetchJSON('/api/me', {}, 8000);
  } catch (e) {
    showAuth('login');
    showAuthError('无法连接服务器，请确认已运行 node server.js');
    return;
  }
  if (me.needsSetup) {
    showAuth('setup');
  } else if (me.user) {
    account = me.user;
    enterChat();
  } else {
    showAuth('login');
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
