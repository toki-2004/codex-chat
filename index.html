<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Codex Chat</title>
<style>
:root {
  --bg: #f2f3f7;
  --card: #ffffff;
  --line: #e5e7ee;
  --text: #23262f;
  --muted: #8a8f98;
  --accent: #4c6ef5;
  --accent-soft: #eef1fe;
  --agent: #10a37f;
  --agent-soft: #e7f7f2;
  --danger: #e5484d;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(25, 32, 60, .06);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.hidden { display: none !important; }
.view { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }

/* ---------- 顶部栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
.logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #4c6ef5, #10a37f);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex: none;
}
.sub { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 8px 13px; font-size: 13px; cursor: pointer; flex: none;
}
.btn:active { filter: brightness(.94); }
.icon-btn {
  border: none; background: none; font-size: 18px; cursor: pointer;
  width: 36px; height: 36px; border-radius: 10px; color: var(--text);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: var(--bg); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #c0c4cf; display: inline-block; }
.conn-dot.on { background: #12b886; }
.conn-dot.off { background: var(--danger); }

/* ---------- 消息区 ---------- */
.chat-main { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.msg-row { display: flex; flex-direction: column; max-width: 88%; }
.msg-row.me { align-self: flex-end; align-items: flex-end; }
.msg-row.other { align-self: flex-start; align-items: flex-start; }
.msg-row.system { align-self: center; max-width: 96%; }
.msg-meta { font-size: 11px; color: var(--muted); margin: 0 4px 3px; display: flex; gap: 6px; align-items: center; }
.msg-meta .m-name { font-weight: 600; }
.bubble {
  background: var(--card); border-radius: 14px; padding: 8px 12px;
  box-shadow: var(--shadow); font-size: 14px; line-height: 1.55;
  word-break: break-word;
}
.msg-row.me .bubble { background: var(--accent-soft); }
.msg-row.agent .bubble { background: var(--agent-soft); }
.msg-row.system .bubble { background: transparent; box-shadow: none; color: var(--muted); font-size: 12px; padding: 2px 8px; text-align: center; }
.bubble p { margin: 0 0 6px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble code {
  background: rgba(35, 38, 47, .08); border-radius: 4px; padding: 1px 5px;
  font-family: Consolas, Menlo, monospace; font-size: 13px;
}
.bubble pre.code {
  background: #1e2430; color: #e8ecf5; border-radius: 10px; padding: 10px 12px;
  overflow-x: auto; margin: 6px 0;
}
.bubble pre.code code { background: none; padding: 0; color: inherit; font-size: 12.5px; }
.bubble a { color: var(--accent); }

.typing-row { align-self: flex-start; display: flex; gap: 8px; align-items: center; }
.typing-bubble {
  background: var(--agent-soft); border-radius: 14px; padding: 10px 14px;
  display: flex; gap: 4px; align-items: center;
}
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--agent); animation: blink 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: .2s; }
.typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

/* ---------- 输入栏 ---------- */
.input-bar {
  flex: none; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--card); border-top: 1px solid var(--line);
}
.input-bar textarea {
  flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font-size: 15px; font-family: inherit; max-height: 120px;
  outline: none; background: var(--bg); color: var(--text);
}
.input-bar textarea:focus { border-color: var(--accent); background: #fff; }
.send-btn {
  width: 44px; height: 44px; border-radius: 12px; border: none; flex: none;
  background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
}
.send-btn:disabled { opacity: .45; }
.footbar {
  flex: none; padding: 6px 14px calc(6px + env(safe-area-inset-bottom));
  font-size: 11px; color: var(--muted); text-align: center; border-top: 1px solid var(--line);
  background: var(--card);
}
.footbar .mono { font-family: Consolas, Menlo, monospace; }

/* ---------- 成员面板 ---------- */
.side-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 82vw);
  background: var(--card); box-shadow: -6px 0 24px rgba(0,0,0,.12); z-index: 40;
  display: flex; flex-direction: column; transform: translateX(105%); transition: transform .22s ease;
}
.side-panel.open { transform: translateX(0); }
.side-panel .sp-head { padding: 14px 16px; font-weight: 700; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.side-panel .sp-head span { flex: 1; }
.sp-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.member-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 14px; }
.member-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.panel-mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 35; }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(20, 24, 38, .45); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--card); border-radius: 16px; width: min(420px, 100%);
  padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.2);
}
.modal h3 { margin: 0 0 14px; font-size: 17px; }
.modal label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
.modal input {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 15px; outline: none;
}
.modal input:focus { border-color: var(--accent); }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(10px);
  background: #242936; color: #fff; font-size: 13px; padding: 10px 18px;
  border-radius: 12px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60;
  max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="view" id="chatView">
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <div style="min-width:0">
        <div>Codex</div>
        <div class="sub" id="connText"><span class="conn-dot" id="connDot"></span> 连接中…</div>
      </div>
    </div>
    <button class="btn" id="memberBtn">成员 <span id="onlineNum">0</span></button>
    <button class="btn" id="nameBtn">改名</button>
  </header>

  <main class="chat-main" id="chatMain">
    <div class="msg-list" id="msgList"></div>
    <div class="typing-row hidden" id="typingRow">
      <div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>
    </div>
  </main>

  <footer class="input-bar">
    <textarea id="chatInput" rows="1" placeholder="给本机 Codex 发消息，Enter 发送" autocomplete="off"></textarea>
    <button class="send-btn" id="sendBtn" title="发送">➤</button>
  </footer>
  <div class="footbar" id="footbar">加载中…</div>
</div>

<!-- 成员面板 -->
<div class="panel-mask hidden" id="panelMask"></div>
<div class="side-panel" id="memberPanel">
  <div class="sp-head"><span>在线设备</span><button class="icon-btn" id="panelCloseBtn">✕</button></div>
  <div class="sp-body" id="memberList"></div>
</div>

<!-- 弹窗容器 -->
<div class="modal-mask hidden" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';

/* ================= 工具 ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(ts) {
  const d = new Date(ts);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const now = new Date();
  return (d.toDateString() === now.toDateString()) ? hm : (pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + hm);
}

async function fetchJSON(url, opts, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 8000);
  try {
    const res = await fetch(url, Object.assign({ signal: ctrl.signal }, opts));
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) { /* 忽略 */ }
      throw new Error(msg);
    }
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

/* ================= 用户身份 ================= */
const NAME_A = ['流云', '晚风', '晨光', '星河', '山茶', '白露', '青禾', '远岫', '松涛', '微澜', '星野', '月白'];
const NAME_B = ['旅人', '拾光', '听雨', '观澜', '逐风', '望舒', '探星', '寻鹿', '煮雪', '渡舟'];
const COLORS = ['#4c6ef5', '#12b886', '#fa5252', '#f59f00', '#7048e8', '#0ca678', '#e8590c', '#3b5bdb', '#c2255c', '#1098ad'];

function randomId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function loadUser() {
  try {
    const raw = localStorage.getItem('cc_user');
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 忽略 */ }
  const u = {
    id: randomId(),
    name: NAME_A[Math.floor(Math.random() * NAME_A.length)] + '·' + NAME_B[Math.floor(Math.random() * NAME_B.length)],
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
  };
  saveUser(u);
  return u;
}
function saveUser(u) {
  try { localStorage.setItem('cc_user', JSON.stringify(u)); } catch (e) { /* 忽略 */ }
}
let user = loadUser();

/* ================= 全局状态 ================= */
let messages = [];
let codexBusy = false;
let serverCfg = { cwd: '', model: 'default', sandbox: '', maxMessageLen: 500 };

const socket = io({ transports: ['websocket', 'polling'] });

/* ================= Markdown（安全渲染） ================= */
function renderMarkdown(text) {
  const blocks = [];
  let html = esc(text).replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push('<pre class="code"><code>' + code + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  html = html
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, '<br>');
  return html.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[Number(i)]);
}

/* ================= 消息渲染 ================= */
const MAX_CLIENT_MSGS = 300;

function msgBubble(m) {
  if (m.role === 'system') {
    return '<div class="msg-row system"><div class="bubble">' + esc(m.text) + '</div></div>';
  }
  const isAgent = m.role === 'agent' || m.userId === 'codex';
  const isMe = m.userId === user.id;
  const cls = isAgent ? 'agent' : (isMe ? 'me' : 'other');
  const name = isAgent ? 'Codex' : m.name;
  const color = isAgent ? '#10a37f' : (m.color || '#888888');
  const body = isAgent ? '<div class="bubble">' + renderMarkdown(m.text) + '</div>'
    : '<div class="bubble">' + esc(m.text) + '</div>';
  return '<div class="msg-row ' + cls + '">'
    + '<div class="msg-meta"><span class="m-name" style="color:' + esc(color) + '">' + esc(name) + '</span>'
    + (isMe ? '<span>(我)</span>' : '') + '<span>' + fmtTime(m.at) + '</span></div>'
    + body + '</div>';
}

function renderChat() {
  $('msgList').innerHTML = messages.map(msgBubble).join('');
  scrollToBottom(false);
}

function scrollToBottom(force) {
  const el = $('chatMain');
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  if (force || nearBottom) el.scrollTop = el.scrollHeight;
}

function mergeMessages(incoming) {
  if (!Array.isArray(incoming) || !incoming.length) return;
  const have = new Set(messages.map((m) => m.id));
  for (const m of incoming) if (m && m.id && !have.has(m.id)) messages.push(m);
  messages.sort((a, b) => a.at - b.at);
  if (messages.length > MAX_CLIENT_MSGS) messages = messages.slice(-MAX_CLIENT_MSGS);
}

/* ================= 发送消息 ================= */
function sendChat() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (text.length > serverCfg.maxMessageLen) return toast('消息过长（最多 ' + serverCfg.maxMessageLen + ' 字）');
  input.value = '';
  autosize();
  socket.emit('chat-message', { text }, (res) => {
    if (!res || !res.ok) {
      toast((res && res.reason) || '发送失败');
      input.value = text;
      autosize();
    }
  });
}

function autosize() {
  const el = $('chatInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

/* ================= Socket 事件 ================= */
socket.on('connect', async () => {
  setConn('on');
  socket.emit('set-user', user);
  try {
    const data = await fetchJSON('/api/messages', {}, 8000);
    mergeMessages(data.messages);
    renderChat();
    if (data.messages && data.messages.length) scrollToBottom(true);
  } catch (e) { /* 忽略 */ }
});
socket.on('disconnect', () => setConn('off'));
socket.on('connect_error', () => setConn('off'));

socket.on('welcome', (p) => {
  if (p && p.config) {
    serverCfg = Object.assign(serverCfg, p.config);
    $('chatInput').maxLength = p.config.maxMessageLen || 500;
    updateFootbar();
  }
});

socket.on('chat-message', (m) => {
  if (!m || m.text == null) return;
  mergeMessages([m]);
  renderChat();
});

socket.on('codex-status', (p) => {
  codexBusy = !!(p && p.busy);
  $('typingRow').classList.toggle('hidden', !codexBusy);
  if (!codexBusy) scrollToBottom(true);
});

socket.on('members', (list) => {
  const members = Array.isArray(list) ? list : [];
  $('onlineNum').textContent = members.length;
  $('memberList').innerHTML = members.map((m) =>
    '<div class="member-item"><span class="member-dot" style="background:' + esc(m.color || '#888') + '"></span>'
    + esc(m.name || '匿名设备') + (m.userId === user.id ? '（我）' : '') + '</div>'
  ).join('') || '<div class="member-item" style="color:var(--muted)">暂无其他设备</div>';
});

function setConn(state) {
  const dot = $('connDot');
  dot.classList.toggle('on', state === 'on');
  dot.classList.toggle('off', state === 'off');
  $('connText').innerHTML = '<span class="conn-dot" id="connDot"></span> '
    + (state === 'on' ? '已连接本机 Codex' : (state === 'off' ? '连接已断开' : '连接中…'));
  // 重新绑定（innerHTML 重建了节点）
  const dot2 = $('connDot');
  dot2.classList.toggle('on', state === 'on');
  dot2.classList.toggle('off', state === 'off');
}

function updateFootbar() {
  const cwd = serverCfg.cwd || '';
  $('footbar').innerHTML = 'Codex 模型 <span class="mono">' + esc(serverCfg.model) + '</span>'
    + ' · 沙箱 <span class="mono">' + esc(serverCfg.sandbox) + '</span>'
    + (cwd ? ' · 工作目录 <span class="mono">' + esc(cwd) + '</span>' : '');
}

/* ================= 成员面板 ================= */
function togglePanel(open) {
  $('memberPanel').classList.toggle('open', open);
  $('panelMask').classList.toggle('hidden', !open);
}

/* ================= 改名 ================= */
function openNameDialog() {
  $('modalBox').innerHTML =
    '<h3>修改昵称</h3>'
    + '<input id="nameInput" maxlength="24" value="' + esc(user.name) + '">'
    + '<div class="modal-btns"><button class="btn" id="nameCancel">取消</button><button class="btn primary" id="nameOk">保存</button></div>';
  $('modalMask').classList.remove('hidden');
  const box = $('modalBox');
  box.querySelector('#nameInput').focus();
  box.querySelector('#nameCancel').onclick = closeNameDialog;
  box.querySelector('#nameOk').onclick = () => {
    const name = box.querySelector('#nameInput').value.trim().slice(0, 24);
    if (!name) return toast('昵称不能为空');
    user.name = name;
    saveUser(user);
    socket.emit('set-user', user);
    closeNameDialog();
    toast('昵称已更新');
  };
}
function closeNameDialog() {
  $('modalMask').classList.add('hidden');
}

/* ================= 初始化 ================= */
function init() {
  $('sendBtn').onclick = sendChat;
  $('nameBtn').onclick = openNameDialog;
  $('memberBtn').onclick = () => togglePanel(true);
  $('panelCloseBtn').onclick = () => togglePanel(false);
  $('panelMask').onclick = () => togglePanel(false);
  $('modalMask').addEventListener('click', (e) => {
    if (e.target === $('modalMask')) closeNameDialog();
  });

  const input = $('chatInput');
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendChat();
    }
  });

  fetchJSON('/api/config', {}, 5000).then((cfg) => {
    if (cfg) {
      serverCfg = Object.assign(serverCfg, cfg);
      input.maxLength = cfg.maxMessageLen || 500;
      updateFootbar();
    }
  }).catch(() => { /* 忽略 */ });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
